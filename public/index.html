<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketing Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="login" class="login-view">
      <section class="login-panel">
        <p class="eyebrow">Marketing operations</p>
        <h1>Marketing Dashboard</h1>
        <p class="login-copy">Tickets, website changes, content requests, and weekly wins in one place.</p>
        <form id="login-form">
          <label>
            User
            <select name="username">
              <option value="zac">Zac</option>
              <option value="adam">Adam</option>
              <option value="nick">Nick</option>
              <option value="perry">Perry</option>
              <option value="kerry">Kerry</option>
            </select>
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password">
          </label>
          <button type="submit">Open dashboard</button>
          <p id="login-error" class="error" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <div id="app" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand">
          <span class="mark"><img src="/fenster-logo.png" alt="Fenster Glazing"></span>
          <div>
            <strong>Fenster Marketing Hub</strong>
            <small id="active-user"></small>
          </div>
        </div>
        <nav id="tabs" class="tabs" aria-label="Dashboard tabs"></nav>
        <button id="logout" class="ghost-button">Sign out</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live marketing command desk</p>
            <h2 id="view-title">Dashboard</h2>
          </div>
          <button id="quick-add" class="primary-button">New ticket</button>
        </header>

        <section id="view"></section>
      </section>
    </div>

    <dialog id="modal">
      <form method="dialog" class="modal-card">
        <button class="icon-button close" value="cancel" aria-label="Close">x</button>
        <h3 id="modal-title">New item</h3>
        <div id="modal-fields"></div>
        <button id="modal-submit" class="primary-button" value="default">Save</button>
      </form>
    </dialog>

    <dialog id="notes-modal">
      <form method="dialog" class="modal-card">
        <button class="icon-button close" value="cancel" aria-label="Close">x</button>
        <h3 id="notes-title">Ticket notes</h3>
        <p id="notes-subtitle" class="modal-intro"></p>
        <div id="notes-list" class="notes-list"></div>
        <label>
          Add update
          <textarea id="note-body" placeholder="What changed, what was done, or what is blocking it?"></textarea>
        </label>
        <button id="note-submit" class="primary-button" value="default">Add note</button>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
